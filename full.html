<!DOCTYPE html>
<!-- MBTI Party v1.1 · 93 题完整版 · 单文件独立运行 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="93 题完整版 MBTI 风格性格测评，单文件网页，零依赖、完全离线可用，聚会破冰娱乐工具。仅供娱乐参考。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C1B1A'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='bold' text-anchor='middle' fill='%23FF6B5E'%3EM%3C/text%3E%3C/svg%3E">
<title>MBTI 性格测评 · 聚会版（93 题完整版）</title>
<style>
  :root{
    --paper:#FBF9F4; --ink:#1C1B1A; --sub:#6E6A63; --line:#E7E2D8; --card:#FFFFFF;
    --e:#FF6B5E; --i:#4F5DDB; --s:#E9A13B; --n:#8B5CF6; --t:#2E9E8F; --f:#F2617A; --j:#3A8FD9; --p:#F0B429;
    --serif:Georgia,"Times New Roman","Songti SC","SimSun",serif;
    --sans:"PingFang SC","Microsoft YaHei","HarmonyOS Sans SC",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.6;overflow-x:hidden}
  .screen{min-height:100dvh;display:none;flex-direction:column}
  .screen.active{display:flex;animation:fadein .35s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .wrap{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:560px;margin:0 auto;padding:32px 22px}
  button{font-family:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible{outline:3px solid var(--i);outline-offset:3px;border-radius:8px}

  /* ── 欢迎页 ── */
  .eyebrow{font-size:12px;letter-spacing:.35em;color:var(--sub);text-transform:uppercase}
  .hero-mbti{font-family:var(--serif);font-size:clamp(72px,20vw,124px);font-weight:700;line-height:1;margin:10px 0 6px;letter-spacing:.02em}
  .hero-mbti span{display:inline-block}
  .hero-mbti .l-m{color:var(--e)} .hero-mbti .l-b{color:var(--s)} .hero-mbti .l-t{color:var(--t)} .hero-mbti .l-i{color:var(--j)}
  .hero-sub{font-size:16px;color:var(--ink);margin-bottom:14px}
  .facts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:30px}
  .fact{font-size:12.5px;color:var(--sub);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:17px 20px;font-size:16.5px;font-weight:600;transition:transform .12s ease,box-shadow .12s ease}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--ink);color:var(--paper)}
  .btn-primary:hover{box-shadow:0 6px 18px rgba(28,27,26,.25)}
  .btn-ghost{background:transparent;color:var(--sub);border:1.5px solid var(--line);font-weight:500;margin-top:10px;padding:13px 20px}
  .fineprint{margin-top:22px;font-size:12px;color:var(--sub);text-align:center}

  /* ── 答题页 ── */
  #screen-quiz .wrap{justify-content:flex-start;padding-top:0;max-width:600px}
  .quiz-top{position:sticky;top:0;background:linear-gradient(var(--paper) 78%,transparent);padding:18px 0 14px;z-index:2}
  .quiz-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .quiz-count{font-family:var(--serif);font-size:15px;color:var(--sub)}
  .quiz-count b{font-size:22px;color:var(--ink)}
  .link-restart{background:none;border:none;font-size:12.5px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
  .track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--e),var(--s),var(--t),var(--j));transition:width .3s ease}
  .qtext{font-size:clamp(21px,5.6vw,27px);font-weight:700;line-height:1.5;margin:38px 0 30px;min-height:4.2em}
  .opts{display:flex;flex-direction:column;gap:14px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px 18px;font-size:16.5px;line-height:1.5;color:var(--ink);transition:border-color .12s,transform .12s}
  .opt:hover{border-color:var(--ink)}
  .opt:active{transform:scale(.985)}
  .opt .key{flex:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:17px;font-weight:700;color:var(--sub)}
  .opt.selected{border-color:var(--ink);background:#F6F2E9}
  .opt.selected .key{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .btn-prev{align-self:flex-start;background:none;border:none;color:var(--sub);font-size:14px;padding:10px 6px;margin-top:2px;text-decoration:underline;text-underline-offset:3px}
  .btn-prev[hidden]{display:none}
  .quiz-foot{margin-top:auto;padding:26px 0 8px;text-align:center;font-size:12px;color:var(--sub)}

  /* ── 结果页 ── */
  #screen-result .wrap{justify-content:center;text-align:center}
  .type-letters{font-family:var(--serif);font-size:clamp(84px,24vw,150px);font-weight:700;line-height:1;letter-spacing:.03em}
  .type-name{font-size:clamp(24px,6vw,30px);font-weight:700;margin-top:8px}
  .type-tag{font-size:13.5px;color:var(--sub);margin-top:4px}
  .spectra{margin:36px 0 8px;display:flex;flex-direction:column;gap:22px;text-align:left}
  .spec-head{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:7px}
  .spec-head .pct{font-variant-numeric:tabular-nums;font-family:var(--serif)}
  .spec-bar{position:relative;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
  .spec-bar .left-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px 0 0 99px}
  .spec-bar .axis{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--paper);border-radius:2px}
  .spec-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:5px}
  .result-note{margin:22px 0 18px;font-size:12.5px;color:var(--sub)}

  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);font-size:13.5px;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s ease;z-index:9}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .confirm-mask{position:fixed;inset:0;background:rgba(28,27,26,.45);display:none;place-items:center;z-index:8;padding:24px}
  .confirm-mask.show{display:grid}
  .confirm-box{background:var(--card);border-radius:16px;padding:26px 24px;max-width:340px;width:100%;text-align:center}
  .confirm-box p{font-size:15px;font-weight:600;margin-bottom:4px}
  .confirm-box .hint{font-size:13px;color:var(--sub);margin-bottom:18px}
  .confirm-box .row{display:flex;gap:10px}
  .confirm-box .row .btn{padding:12px;font-size:14.5px}
</style>
</head>
<body>

<!-- 欢迎页 -->
<section class="screen active" id="screen-welcome">
  <div class="wrap">
    <div class="eyebrow">MBTI 性格测评 · 聚会版</div>
    <h1 class="hero-mbti" aria-label="MBTI"><span class="l-m">M</span><span class="l-b">B</span><span class="l-t">T</span><span class="l-i">I</span></h1>
    <p class="hero-sub">93 道题，看清你站在每条性格光谱的哪一端。</p>
    <div class="facts">
      <span class="fact">93 题 · 约 12 分钟</span>
      <span class="fact">进度自动保存</span>
      <span class="fact">离线可用 · 数据不出设备</span>
    </div>
    <button class="btn btn-primary" id="btn-start">开始测评</button>
    <button class="btn btn-ghost" id="btn-fresh" hidden>不继续了，从头开始</button>
    <p class="fineprint">本测评仅供娱乐参考，不构成任何专业心理结论。</p>
  </div>
</section>

<!-- 答题页 -->
<section class="screen" id="screen-quiz">
  <div class="wrap">
    <div class="quiz-top">
      <div class="quiz-meta">
        <span class="quiz-count">第 <b id="q-now">1</b><span id="q-total"> / 93</span> 题</span>
        <button class="link-restart" id="btn-quit">重新开始</button>
      </div>
      <div class="track"><div class="fill" id="q-fill"></div></div>
    </div>
    <p class="qtext" id="q-text"></p>
    <div class="opts">
      <button class="opt" id="opt-a"><span class="key">A</span><span id="opt-a-text"></span></button>
      <button class="opt" id="opt-b"><span class="key">B</span><span id="opt-b-text"></span></button>
    </div>
    <button class="btn-prev" id="btn-prev">← 上一题（可修改答案）</button>
    <p class="quiz-foot" id="quiz-foot">选择后自动进入下一题 · 进度实时保存</p>
  </div>
</section>

<!-- 结果页 -->
<section class="screen" id="screen-result">
  <div class="wrap">
    <div class="eyebrow">你的类型</div>
    <div class="type-letters" id="r-letters"></div>
    <h2 class="type-name" id="r-name"></h2>
    <p class="type-tag" id="r-tag"></p>
    <div class="spectra" id="r-spectra"></div>
    <p class="result-note">MBTI 仅供娱乐参考，不构成任何专业心理测评结论。</p>
    <button class="btn btn-primary" id="btn-again">重新测一次</button>
  </div>
</section>

<div class="toast" id="toast"></div>
<div class="confirm-mask" id="mask-quit">
  <div class="confirm-box">
    <p>放弃这次测评？</p>
    <p class="hint">当前作答记录将被清空，无法恢复。</p>
    <div class="row">
      <button class="btn btn-ghost" style="margin-top:0" id="quit-no">再想想</button>
      <button class="btn btn-primary" id="quit-yes">清空重来</button>
    </div>
  </div>
</div>

<script>

const QUESTIONS = [

  {d:'EI',a:'周五晚上有场热闹的聚会，我通常都会去，人多才热闹',b:'比起聚会，我更想在家安静待着'},

  {d:'EI',a:'思考问题时我喜欢说出来和大家讨论',b:'思考问题时我习惯自己先想清楚再说'},

/* ================= 维度与类型数据 ================= */
const DIMS = {
  EI:{ left:{k:'E',name:'外向',color:'var(--e)'}, right:{k:'I',name:'内向',color:'var(--i)'} },
  SN:{ left:{k:'S',name:'实感',color:'var(--s)'}, right:{k:'N',name:'直觉',color:'var(--n)'} },
  TF:{ left:{k:'T',name:'思考',color:'var(--t)'}, right:{k:'F',name:'情感',color:'var(--f)'} },
  JP:{ left:{k:'J',name:'判断',color:'var(--j)'}, right:{k:'P',name:'知觉',color:'var(--p)'} }
};
const DIM_ORDER = ['EI','SN','TF','JP'];
const LETTER_COLOR = {E:'var(--e)',I:'var(--i)',S:'var(--s)',N:'var(--n)',T:'var(--t)',F:'var(--f)',J:'var(--j)',P:'var(--p)'};
const TYPE_NAMES = {
  INTJ:'建筑师', INTP:'逻辑学家', ENTJ:'指挥官', ENTP:'辩论家',
  INFJ:'提倡者', INFP:'调停者', ENFJ:'主人公', ENFP:'竞选者',
  ISTJ:'物流师', ISFJ:'守卫者', ESTJ:'总经理', ESFJ:'执政官',
  ISTP:'鉴赏家', ISFP:'探险家', ESTP:'企业家', ESFP:'表演者'
};
const STORE_KEY = 'mbti_party_full_v1'; /* 与 20 题版分开存储，互不覆盖 */
const TOTAL = QUESTIONS.length; /* 93 */

/* ================= 状态与存取 ================= */
let storageOK = true; /* 隐私模式等场景 localStorage 可能不可用，降级为可玩但无续答 */
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!Array.isArray(data.answers) || data.answers.length !== TOTAL) return null;
    return data;
  }catch(e){ storageOK = false; return null; }
}
function saveState(answers){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({answers})); }
  catch(e){
    if(storageOK){
      storageOK = false;
      toast('当前浏览器无法保存进度，刷新后需重新作答');
    }
  }
}
function clearState(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }
function doneCount(answers){
  let n = 0;
  for(const a of answers){ if(a === 'a' || a === 'b') n++; }
  return n;
}

/* ================= 视图切换 ================= */
const $ = id => document.getElementById(id);
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}

/* ================= 欢迎页 ================= */
function renderWelcome(){
  const st = loadState();
  const done = st ? doneCount(st.answers) : 0;
  const btnStart = $('btn-start');
  $('btn-fresh').hidden = true;
  if(done === 0){
    btnStart.textContent = '开始测评';
    btnStart.onclick = startQuiz;
  }else if(done < TOTAL){
    btnStart.textContent = '继续作答（已完成 ' + done + '/' + TOTAL + '）';
    btnStart.onclick = startQuiz;
    $('btn-fresh').hidden = false;
  }else{
    btnStart.textContent = '查看上次结果';
    btnStart.onclick = () => renderResult(st.answers);
    $('btn-fresh').hidden = false;
  }
  showScreen('screen-welcome');
}
function startQuiz(){
  const st = loadState();
  const answers = (st && doneCount(st.answers) > 0 && doneCount(st.answers) < TOTAL) ? st.answers.slice() : new Array(TOTAL).fill(null);
  showScreen('screen-quiz');
  renderQuestion(answers);
}

/* ================= 答题页 =================
   选项左右顺序做确定性打乱（同一题每次打开顺序一致，避免"总选 A"的反应偏差） */
function isFlipped(idx){ return (idx * 7919 + 11) % 2 === 0; }
let currentAnswers = null;
let currentIndex = 0;

function renderQuestion(answers){
  currentAnswers = answers;
  let idx = answers.findIndex(x => x === null);
  if(idx === -1){ renderResult(answers); return; }
  renderQuestionAt(idx);
}
function renderQuestionAt(idx){
  currentIndex = idx;
  const q = QUESTIONS[idx];
  const flip = isFlipped(idx);
  $('q-now').textContent = idx + 1;
  $('q-total').textContent = ' / ' + TOTAL;
  $('q-fill').style.width = (idx / TOTAL * 100) + '%';
  $('q-text').textContent = '哪句更像你？';
  $('opt-a-text').textContent = flip ? q.b : q.a;
  $('opt-b-text').textContent = flip ? q.a : q.b;
  /* 已答题回显：高亮之前选过的选项，用户可改选或原样确认 */
  const chosen = currentAnswers[idx]; /* 'a'=第一极 | 'b'=第二极 | null */
  const screenA = flip ? 'b' : 'a';   /* 屏幕 A 对应的语义选项 */
  const optA = $('opt-a'), optB = $('opt-b');
  optA.classList.toggle('selected', chosen === screenA);
  optB.classList.toggle('selected', chosen !== null && chosen !== screenA);
  $('btn-prev').hidden = idx === 0;
  $('quiz-foot').textContent = storageOK
    ? '选择后自动进入下一题 · 进度实时保存'
    : '选择后自动进入下一题 · 当前进度保存不可用';
  $('opt-a').blur(); $('opt-b').blur();
}

function choose(choice){
  /* choice 是"屏幕上的 A/B"；换算回 first/second 语义 */
  const flip = isFlipped(currentIndex);
  let semantic;
  if(choice === 'a') semantic = flip ? 'b' : 'a';
  else semantic = flip ? 'a' : 'b';
  currentAnswers[currentIndex] = semantic;
  saveState(currentAnswers);
  /* 前进到下一个未答题：误操作回改后可直接回到最新进度 */
  let next = -1;
  for(let i = currentIndex + 1; i < TOTAL; i++){
    if(currentAnswers[i] === null){ next = i; break; }
  }
  if(next === -1){ renderResult(currentAnswers); }
  else{ renderQuestionAt(next); }
}

/* ================= 计分与结果页 ================= */
function computeResult(answers){
  const stats = {};
  DIM_ORDER.forEach(d => stats[d] = {first:0, total:0});
  answers.forEach((ans, i) => {
    const q = QUESTIONS[i];
    if(ans !== 'a' && ans !== 'b') return;
    stats[q.d].total++;
    if(ans === 'a') stats[q.d].first++;
  });
  const letters = [], details = [];
  DIM_ORDER.forEach(d => {
    const dim = DIMS[d];
    const st = stats[d];
    const leftPct = st.total ? Math.round(st.first / st.total * 100) : 50;
    const rightPct = 100 - leftPct;
    /* 平局取左极（E/S/T/J）；JP 为奇数题不存在平局 */
    const letter = leftPct >= rightPct ? dim.left.k : dim.right.k;
    letters.push(letter);
    details.push({d, leftPct, rightPct});
  });
  return {type: letters.join(''), details};
}

function renderResult(answers){
  saveState(answers);
  const {type, details} = computeResult(answers);
  const box = $('r-letters');
  box.innerHTML = '';
  type.split('').forEach(ch => {
    const span = document.createElement('span');
    span.textContent = ch;
    span.style.color = LETTER_COLOR[ch];
    box.appendChild(span);
  });
  $('r-name').textContent = TYPE_NAMES[type] || type;
  $('r-tag').textContent = '93 题完整测评结果';
  const spectra = $('r-spectra');
  spectra.innerHTML = '';
  details.forEach(({d, leftPct, rightPct}) => {
    const dim = DIMS[d];
    const item = document.createElement('div');
    item.innerHTML =
      '<div class="spec-head">' +
        '<span class="pct" style="color:' + dim.left.color + '">' + leftPct + '%</span>' +
        '<span class="pct" style="color:' + dim.right.color + '">' + rightPct + '%</span>' +
      '</div>' +
      '<div class="spec-bar">' +
        '<div class="left-fill" style="width:' + leftPct + '%;background:' + dim.left.color + '"></div>' +
        '<div class="axis"></div>' +
      '</div>' +
      '<div class="spec-cap"><span>' + dim.left.k + ' · ' + dim.left.name + '</span><span>' + dim.right.k + ' · ' + dim.right.name + '</span></div>';
    /* 右侧填充 */
    const bar = item.querySelector('.spec-bar');
    const rf = document.createElement('div');
    rf.style.cssText = 'position:absolute;right:0;top:0;bottom:0;border-radius:0 99px 99px 0;width:' + rightPct + '%;background:' + dim.right.color;
    bar.appendChild(rf);
    bar.appendChild(item.querySelector('.axis')); /* 轴线保持在最上层 */
    spectra.appendChild(item);
  });
  showScreen('screen-result');
}

/* ================= 事件绑定 ================= */
$('opt-a').addEventListener('click', () => choose('a'));
$('opt-b').addEventListener('click', () => choose('b'));
$('btn-prev').addEventListener('click', () => {
  if(currentIndex > 0) renderQuestionAt(currentIndex - 1);
});
$('btn-fresh').addEventListener('click', () => {
  clearState();
  renderWelcome();
});
$('btn-again').addEventListener('click', () => {
  clearState();
  renderWelcome();
});
$('btn-quit').addEventListener('click', () => $('mask-quit').classList.add('show'));
$('quit-no').addEventListener('click', () => $('mask-quit').classList.remove('show'));
$('quit-yes').addEventListener('click', () => {
  $('mask-quit').classList.remove('show');
  clearState();
  renderWelcome();
  toast('已清空，随时重新开始');
});
document.querySelector('#mask-quit').addEventListener('click', e => {
  if(e.target === e.currentTarget) e.currentTarget.classList.remove('show');
});

let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ================= 启动 ================= */
renderWelcome();
</script>
